# The existing tunnel connects to port 80 inside Docker. Port 8088 is the
# loopback-published SSH entry point and ignores client-supplied CF IP headers.
map $http_cf_connecting_ip $cf_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
map $server_port $quenaris_client_ip {
    80 $cf_client_ip;
    default $remote_addr;
}
map $http_x_forwarded_proto $cloudflare_proto {
    default http;
    https https;
}
map "$server_port:$cloudflare_proto" $quenaris_redirect {
    "80:http" 1;
    default 0;
}
map $server_port $quenaris_proto {
    80 $cloudflare_proto;
    default https;
}
map $uri $quenaris_private_cache {
    ~^/(api|media)(/|$) "private, no-store";
    default "";
}

server {
    listen 80;
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://web:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cache-Control $quenaris_private_cache always;

    if ($quenaris_redirect) { return 301 https://$host$request_uri; }
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location ^~ /static/ { return 404; }
    location ~ "^/api/(?:analyses/[0-9a-f-]{36}|shared/[0-9a-f-]{36})/featured-image/$" {
        client_max_body_size 3m;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $quenaris_client_ip;
        proxy_set_header X-Forwarded-Proto $quenaris_proto;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $quenaris_client_ip;
        # Cloudflare overwrites this header. The SSH-only local port is treated
        # as secure by Django; it must remain bound to host loopback.
        proxy_set_header X-Forwarded-Proto $quenaris_proto;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 120s;
    }
    location /media/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $quenaris_client_ip;
        proxy_set_header X-Forwarded-Proto $quenaris_proto;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
