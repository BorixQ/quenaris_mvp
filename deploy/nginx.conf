server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://web:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # Only the separate loopback admin service has these routes.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location ^~ /static/ { return 404; }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    # Authentication and owner checks happen in Django; no public media alias.
    location /media/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
