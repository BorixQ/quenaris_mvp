name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API y procesamiento
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEE_OAUTH_DIRECTORY: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Simular despliegue y reversión
        run: bash tests/test_deploy_homelab.sh
      - name: Construir entorno de pruebas
        run: docker compose -f compose.integration.yml build tests
      - name: Iniciar base de datos y Redis aislados
        run: docker compose -f compose.integration.yml up -d --wait db redis
      - name: Ejecutar pruebas backend
        run: docker compose -f compose.integration.yml run --rm --no-deps tests python -m pytest -q -o cache_dir=/tmp/pytest-cache
      - name: Retirar entorno de pruebas
        if: always()
        run: docker compose -f compose.integration.yml down --volumes

  frontend:
    name: Interfaz y navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - name: Pruebas de interfaz
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Instalar navegador para pruebas
        run: npx playwright install --with-deps chromium
      - name: Comprobar acceso en móvil y escritorio
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
          SECURITY_BROWSER_BASE_URL: http://127.0.0.1:18090
        run: |
          npm run dev -- --port 18090 --strictPort > /tmp/quenaris-vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18090/login > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test e2e/registration.spec.ts e2e/timeline.spec.ts --reporter=list
